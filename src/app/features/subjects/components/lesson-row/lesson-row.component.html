<div [class]="cardClasses()" (click)="toggle()">
  <p-checkbox class="mt-0.5" [ngModel]="selected()" [binary]="true" [readonly]="true" />

  <div class="flex-1 min-w-0 flex flex-col gap-0.5">
    <span
      class="text-sm font-semibold leading-snug transition-colors"
      [class.text-main-800]="selected()"
      [class.text-slate-700]="!selected()"
    >
      {{ lesson().name }}
    </span>
    @if (lesson().description) {
      <p class="text-xs text-slate-400 leading-relaxed line-clamp-1">
        {{ lesson().description }}
      </p>
    }
  </div>

  @if (lesson().sourceCount > 0) {
    <span
      class="shrink-0 inline-flex items-center gap-1 rounded-md bg-slate-100 px-1.5 py-0.5 text-[11px] font-medium text-slate-400"
      [class.bg-main-100]="selected()"
      [class.text-main-600]="selected()"
    >
      <i class="pi pi-paperclip text-[10px]"></i>
      {{ lesson().sourceCount }}
    </span>
  }
</div>
